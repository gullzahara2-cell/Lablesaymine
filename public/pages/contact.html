<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | LABELSAYMINE (Demo)</title>
  <meta name="description" content="Contact LABELSAYMINE (demo page).">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main" class="page">
    <h1 class="page-title">Contact</h1>
    <p class="demo-note">Demo form: nothing is sent or saved.</p>

    <div class="contact-layout">
      <form id="contact-form" novalidate>
        <div class="field">
          <label for="c-name">Name</label>
          <input type="text" id="c-name" autocomplete="name" required>
          <span class="field-error" id="err-c-name"></span>
        </div>
        <div class="field">
          <label for="c-email">Email address</label>
          <input type="email" id="c-email" autocomplete="email" required>
          <span class="field-error" id="err-c-email"></span>
        </div>
        <div class="field">
          <label for="c-order">Order number (optional)</label>
          <input type="text" id="c-order">
        </div>
        <div class="field">
          <label for="c-message">Message</label>
          <textarea id="c-message" rows="6" required></textarea>
          <span class="field-error" id="err-c-message"></span>
        </div>

        <!-- Honeypot: hidden from people, bots tend to fill it -->
        <div class="hp" aria-hidden="true">
          <label for="c-website">Leave this field empty</label>
          <input type="text" id="c-website" tabindex="-1" autocomplete="off">
        </div>

        <button type="submit" class="btn btn-primary">Send message (demo)</button>
        <p id="contact-msg" role="status" aria-live="polite"></p>
      </form>

      <aside class="cart-summary">
        <h2>Business details</h2>
        <p>Response time: PLACEHOLDER (to be confirmed by the client).</p>
        <p>Email: PLACEHOLDER</p>
        <p>Address and KvK number: PLACEHOLDER</p>
        <p class="small-note">Details will be published once the client confirms them (Q-13).</p>
      </aside>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../js/layout.js" data-base="../"></script>
  <script src="../js/products.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/contact.js"></script>
</body>
</html>
